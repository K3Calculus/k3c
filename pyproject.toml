[project]
name = "k3c"
version = "0.2.1"
description = "Kulkarni Calculus (K3) — Design causality, and the system emerges."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Anil Kulkarni"},
]
keywords = ["k3", "calculus", "causal", "specification", "verification", "invariant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://k3c.dev"
Repository = "https://github.com/K3Calculus/k3c"
Documentation = "https://k3c.dev"

[project.optional-dependencies]
blake3 = ["blake3"]
orjson = ["orjson"]

[tool.setuptools.packages.find]
include = ["k3c*"]

[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "hypothesis>=6.151.14",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short --import-mode=importlib"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.1"
version_files = [
    "pyproject.toml:version",
]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
